# Mailternal QA — full IMAP (QRESYNC + CONDSTORE).
# Ports: 1143 STARTTLS, 1993 implicit TLS.

protocols = imap
listen = *
hostname = imap.mailternal.test
postmaster_address = postmaster@mailternal.test
login_greeting = Mailternal QA IMAP ready.
base_dir = /run/dovecot
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = yes
shutdown_clients = yes
default_client_limit = 2048
default_process_limit = 512
default_vsz_limit = 1G

ssl = yes
ssl_cert = </etc/dovecot/certs/dovecot.crt
ssl_key = </etc/dovecot/certs/dovecot.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
mail_location = maildir:~/Maildir
mail_fsync = never
maildir_very_dirty_syncs = yes
mailbox_list_index = yes
mail_max_lock_timeout = 5m
mail_max_userip_connections = 50

namespace inbox {
  inbox = yes
  separator = /
  prefix =
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Horrors {
    auto = subscribe
  }
}

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 1993
    ssl = yes
  }
  process_min_avail = 2
  process_limit = 100
  service_count = 1
}

service imap {
  process_limit = 256
  vsz_limit = 1G
}

service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
}

protocol imap {
  mail_plugins =
  mail_max_userip_connections = 50
  imap_idle_notify_interval = 2mins
}
