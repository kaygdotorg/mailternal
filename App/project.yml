name: Mailternal
options:
  bundleIdPrefix: org.kayg
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MailternalCore:
    path: ..
targets:
  Mailternal:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MailternalCore
        product: MailternalCore
    entitlements:
      path: Mailternal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kayg.mailternal
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "AGPLv3"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Mailternal notifies you when new mail arrives."
