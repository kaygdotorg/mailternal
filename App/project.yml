name: Mailternal
options:
  bundleIdPrefix: org.kayg
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MailternalCore:
    path: ..
targets:
  Mailternal:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - target: MailternalCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/MacOS
      - package: MailternalCore
        product: MailternalCore
      - package: MailternalCore
        product: MailternalAutomation
      - package: MailternalCore
        product: MailternalWorkspace
      - package: MailternalCore
        product: MailternalPairing
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: Network.framework
      - sdk: CloudKit.framework
    info:
      path: Mailternal-Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.kayg.mailternal.message-links
            UTTypeDescription: Mailternal message links
            UTTypeConformsTo:
              - public.data
              - public.plain-text
            UTTypeTagSpecification:
              public.mime-type: application/x-mailternal-message-links
        CFBundleURLTypes:
          - CFBundleURLName: org.kayg.mailternal
            CFBundleURLSchemes:
              - mailternal
        NSCameraUsageDescription: "Mailternal uses the camera to scan a one-time pairing code."
        NSLocalNetworkUsageDescription: "Mailternal uses your local network to securely transfer selected accounts between paired devices."
        NSBonjourServices:
          - _mailternal-pair._tcp
        MailternalKeychainAccessGroup: "$(AppIdentifierPrefix)org.kayg.mailternal"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kayg.mailternal
        EXECUTABLE_NAME: MailternalApp
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Mailternal.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "AGPLv3"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Mailternal notifies you when new mail arrives."
      configs:
        Debug:
          ENABLE_TESTABILITY: true
          ENABLE_APP_SANDBOX: false
          CODE_SIGN_ENTITLEMENTS: Mailternal-Debug.entitlements
  MailternalCLI:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/mailternal
    dependencies:
      - package: MailternalCore
        product: MailternalAutomation
    settings:
      base:
        PRODUCT_NAME: mailternal
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: true
  MailternalAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Support/DeepLinkRouteQueue.swift
      - path: Sources/Model/MessageDetailLoader.swift
      - path: Sources/Viewer/MessageHeadersStore.swift
      - path: AppTests
      - path: Sources/Support/UILogic.swift
      - path: Sources/Support/MessageListPolicies.swift
      - path: Sources/Viewer/MessageHeaderPolicy.swift
      - path: Sources/Support/QRCodePolicy.swift
      - path: Sources/Viewer/QRCodeCard.swift
      - path: Sources/Support/AppearanceSettings.swift
      - path: Sources/Support/AutomationPreferences.swift
      - path: Sources/Support/ActionSettings.swift
      - path: Sources/Shell/WindowBackdrop.swift
      - path: Sources/Support/PartFetchRouting.swift
      - path: Sources/MessageWeb/PartSchemeHandler.swift
      - path: Sources/Support/FaviconStore.swift
      - path: Sources/MessageWeb/MessageReadingPolicy.swift
      - path: Sources/Sidebar/FolderHierarchy.swift
      - path: Sources/Mock/MockMailFacade.swift
      - path: Sources/Composer/MailComposerModel.swift
      - path: Sources/Support/AccountTitlePolicy.swift
      - path: Sources/Support/CacheTreePolicy.swift
      - path: Sources/Support/ProviderPresets.swift
      - path: Sources/Tabs/ReaderTabs.swift
      - path: Sources/Tabs/ReaderTabsPolicy.swift
      - path: Sources/Tabs/ReaderTabsSnapshot.swift
    dependencies:
      - package: MailternalCore
        product: MailternalCore
      - package: MailternalCore
        product: MailternalAutomation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kayg.mailternal.apptests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: ""
        TEST_HOST: ""
  MailternalUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
      - path: Sources/Support/UILogic.swift
      - path: Sources/Support/AppearanceSettings.swift
    dependencies:
      - target: Mailternal
      - package: MailternalCore
        product: MailternalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kayg.mailternal.uitests
        TEST_TARGET_NAME: Mailternal
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Mailternal:
    shared: true
    build:
      targets:
        Mailternal: all
        MailternalAppTests: [test]
        MailternalUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-mock": true
    test:
      config: Debug
      commandLineArguments:
        "-mock": true
      targets:
        - MailternalAppTests
        - MailternalUITests
